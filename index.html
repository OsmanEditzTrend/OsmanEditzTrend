<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Osman Editz Trend | Official Links</title>
  <meta
    name="description"
    content='Editor | "Osman Editz Trend" - Creating global video edits and digital content for a worldwide audience. مصمم وصانع محتوى مرئي لتصاميم المسلسلات والأفلام السينمائية.'
  >
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top, #1f1c2c, #0d0d12);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 20px;
      padding: 36px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 26px;
      color: #ffd700;
      letter-spacing: 0.5px;
    }
    .bio-en {
      color: #e0e0e0;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 10px;
    }
    .bio-ar {
      color: #bdbdbd;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px;
      direction: rtl;
    }
    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #ffd700;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .links a {
      display: block;
      background: #181820;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid #2e2e3a;
      transition: 0.25s;
    }
    .links a:hover {
      background: #ffd700;
      color: #0d0d12;
      border-color: #ffd700;
      transform: translateY(-2px);
    }
    .platform-name {
      display: block;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 3px;
    }
    .platform-url {
      display: block;
      font-size: 12px;
      opacity: 0.75;
      word-break: break-all;
    }
    .footer {
      margin-top: 22px;
      font-size: 12px;
      color: #777777;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Osman Editz Trend</h1>
    <p class="bio-en">
      Editor | "Osman Editz Trend"<br>
      Creating global video edits and digital content for a worldwide audience 🎬.
    </p>
    <p class="bio-ar">
      مصمم وصانع محتوى مرئي متخصص في المونتاج والتصاميم السينمائية للمسلسلات والأفلام العالمية ✨.
    </p>

    <div class="section-title">My Channels</div>

    <div class="links" id="links-container"></div>

    <div class="footer">© 2026 Osman Editz Trend</div>
  </div>

  <script>
    const brand = "OsmanEditzTrend";
    const at = "@";
    const channels = [
      { name: "🎵 TikTok", url: "https://tiktok.com" + at + brand },
      { name: "🎬 YouTube", url: "https://youtube.com" + at + brand },
      { name: "📘 Facebook", url: "https://facebook.com" + brand + "1" },
      { name: "📸 Instagram", url: "https://instagram.com" + brand },
      { name: "💻 Google Developer", url: "https://g.dev" + brand }
    ];

    const container = document.getElementById("links-container");
    channels.forEach(item => {
      const a = document.createElement("a");
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = `<span class="platform-name">${item.name}</span><span class="platform-url">${item.url}</span>`;
      container.appendChild(a);
    });
  </script>
</body>
</html>
